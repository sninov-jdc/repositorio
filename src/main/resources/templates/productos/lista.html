<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<body>

<div th:fragment="contenido">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="sp-titulo mb-0">Productos</h1>
        <a sec:authorize="hasRole('ADMINISTRADOR')"
           th:href="@{/productos/nuevo}" class="btn btn-sp">Nuevo producto</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Unidad</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Stock mínimo</th>
                    <th>Frío</th>
                    <th class="text-end" sec:authorize="hasRole('ADMINISTRADOR')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}">Nombre</td>
                    <td th:text="${p.categoria}">Categoría</td>
                    <td th:text="${p.unidadMedida}">UNIDAD</td>
                    <td class="text-end"
                        th:text="'$ ' + ${#numbers.formatDecimal(p.precioVenta, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                    <td class="text-end"
                        th:text="${p.stockMinimo.stripTrailingZeros().toPlainString()}">0</td>
                    <td>
                        <span th:if="${p.requiereFrio}" class="badge sp-acento border">Sí</span>
                        <span th:unless="${p.requiereFrio}" class="text-muted small">—</span>
                    </td>
                    <td class="text-end" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}"
                           class="btn btn-sm btn-outline-secondary">Editar</a>
                        <a th:href="@{/productos/desactivar/{id}(id=${p.idProducto})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Desactivar este producto?')">Desactivar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        No hay productos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
