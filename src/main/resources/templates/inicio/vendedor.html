<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<div th:fragment="contenido">

    <h1 class="sp-titulo">Panel del vendedor</h1>
    <p class="text-muted">Bienvenido, <span th:text="${#authentication.name}">usuario</span>.</p>

    <div class="row g-3 mt-2">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Registrar venta</h5>
                    <p class="card-text small text-muted">
                        Nueva venta con selección de cliente y productos.
                    </p>
                    <a th:href="@{/ventas}" class="btn btn-sm btn-sp">Ir a ventas</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Consultar stock</h5>
                    <p class="card-text small text-muted">
                        Disponibilidad de productos en inventario.
                    </p>
                    <a th:href="@{/productos}" class="btn btn-sm btn-sp">Ver productos</a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
