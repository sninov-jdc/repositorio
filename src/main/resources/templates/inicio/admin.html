<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<div th:fragment="contenido">

  <h1 class="sp-titulo">Panel del administrador</h1>
  <p class="text-muted">Bienvenido, <span th:text="${#authentication.name}">usuario</span>.</p>

  <div class="row g-3 mt-2">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Inventario</h5>
          <p class="card-text small text-muted">
            Gestión de productos, lotes y movimientos de stock.
          </p>
          <a th:href="@{/productos}" class="btn btn-sm btn-sp">Ir a productos</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Ventas</h5>
          <p class="card-text small text-muted">
            Registro y consulta de ventas y facturación.
          </p>
          <a th:href="@{/ventas}" class="btn btn-sm btn-sp">Ir a ventas</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Temperatura</h5>
          <p class="card-text small text-muted">
            Monitoreo de equipos fríos y alertas.
          </p>
          <a th:href="@{/alertas}" class="btn btn-sm btn-sp">Ver alertas</a>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
