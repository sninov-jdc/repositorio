<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — SIGE PAISA</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/sigepaisa.css}">
</head>
<body class="sp-login-body">

<div>
    <div class="sp-login-card">

        <div class="sp-login-header">
            <h1>SIGE PAISA</h1>
            <p>Salsamentaria El Paisa</p>
        </div>

        <div class="sp-login-body-form">

            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username"
                           required autofocus autocomplete="username">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password"
                           required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-sp w-100 py-2">Ingresar</button>

            </form>

        </div>

    </div>

    <p class="sp-login-pie">
        Sistema de Gestión de Inventario · Acceso exclusivo para personal autorizado
    </p>
</div>

</body>
</html>
